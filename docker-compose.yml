version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: nutribot-postgres
    environment:
      POSTGRES_DB: nutribot
      POSTGRES_USER: nutribot
      POSTGRES_PASSWORD: nutribot
    ports:
      - "5432:5432"
    volumes:
      - nutribot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutribot -d nutribot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nutribot_pgdata:
