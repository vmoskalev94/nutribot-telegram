spring:
  application:
    name: nutribot-telegram
  profiles:
    default: local

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nutribot}
    username: ${SPRING_DATASOURCE_USERNAME:nutribot}
    password: ${SPRING_DATASOURCE_PASSWORD:nutribot}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.nutribot: ${LOGGING_LEVEL_APP:INFO}
    org.flywaydb: ${LOGGING_LEVEL_FLYWAY:INFO}

nutribot:
  telegram:
    token: ${TELEGRAM_BOT_TOKEN}
  features:
    nutrient-explain:
      user-visible: ${TELEGRAM_NUTRIENT_EXPLAIN:false}
